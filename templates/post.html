{% extends "base.html" %}

{% block title %}{{ post.title }}{% endblock %}

{% block content %}
    <article>
        <h1>{{ post.title }}</h1>
        <p><small>作者：{{ post.author }}</small></p>
        <hr>
        <div style="white-space: pre-wrap;">{{ post.content }}</div>
    </article>
    <p style="margin-top: 30px;"><a href="{{ url_for('index') }}">&larr; 返回首頁</a></p>
{% endblock %}
